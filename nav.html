    /* overlay chrome to match index.html brand shell */
    .sp-header {
      position: sticky; top: 0; z-index: 50;

      background: rgba(5,8,15,.88);
      backdrop-filter: blur(14px);
    }
    .sp-bar {
      width: min(1040px, 92vw); margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 0; gap: 12px;
    }
    .sp-mark {
      display: flex; align-items: center; gap: 10px;
      font-weight: 700; letter-spacing: .12em; font-size: 15px; color: #f4f7fb;
    }
    .sp-mark:hover { text-decoration: none; }
    .sp-mark .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: linear-gradient(135deg, #8b7cf8, #22d3c5);
      box-shadow: 0 0 16px rgba(34,211,197,.55);
    }
    .sp-mark span.sub { color: #94a3b8; font-weight: 500; letter-spacing: .16em; font-size: 12px; }
    .sp-links { display: flex; gap: 18px; align-items: center; font-size: 13px; flex-wrap: wrap; }
    .sp-links a { color: #94a3b8; }
    .sp-links a:hover { color: #f4f7fb; }
    .sp-lang {
      border: 1px solid rgba(148,163,184,.14); background: transparent; color: #94a3b8;
      border-radius: 999px; padding: 5px 12px; font-size: 12px; cursor: pointer;
    }
    .sp-lang:hover { color: #f4f7fb; border-color: rgba(34,211,197,.5); }
    .sp-footer {
      border-top: 1px solid rgba(148,163,184,.14);
      padding: 28px 0 40px; color: #94a3b8; font-size: 12px; line-height: 1.7;
    }
    .sp-footer .row {
      width: min(1040px, 92vw); margin: 0 auto;
      display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between;
    }
    .sp-footer a { color: #94a3b8; }
    .sp-footer a:hover { color: #f4f7fb; }
    .sp-legal { max-width: 52em; margin-top: 12px; }
    .sp-legal details { margin-top: 6px; }
    .sp-legal summary { cursor: pointer; color: #94a3b8; }
    .sp-legal p { margin-top: 6px; }
    [data-en] { display: none; }
    html[lang="en"] [data-zh] { display: none; }
    html[lang="en"] [data-en] { display: revert; }
  
    [data-theme="light"] { --sp-bg: #f4f7fb; --sp-ink: #0f172a; --sp-dim: #5b6b82; --sp-line: rgba(15,23,42,.12); }
    [data-theme="light"] body { background: var(--sp-bg, #f4f7fb); color: var(--sp-ink); }
    [data-theme="light"] .sp-header { background: rgba(247,250,252,.92); border-bottom-color: rgba(15,23,42,.12); }
    [data-theme="light"] .sp-mark { color: #0f172a; }
    [data-theme="light"] .sp-links a, [data-theme="light"] .sp-footer { color: #5b6b82; }
    [data-theme="light"] .sp-links a:hover { color: #0f172a; }

<script>
  (function () {
    var btn = document.getElementById('langBtn');
    var sub = document.getElementById('markSub');
    function apply(lang) {
      var en = lang === 'en';
      document.documentElement.lang = en ? 'en' : 'zh-CN';
      btn.textContent = en ? '中文' : 'EN';
      sub.textContent = en ? 'speculation · speculate' : '投机 · 推演';
      try { localStorage.setItem('specul-lang', en ? 'en' : 'zh'); } catch (e) {}
    }
    var init = 'zh';
    try { init = localStorage.getItem('specul-lang') || 'zh'; } catch (e) {}
    apply(init);
    btn.addEventListener('click', function () {
      apply(document.documentElement.lang === 'en' ? 'zh' : 'en');
    });
  })();
  
    (function () {
      var tb = document.getElementById('themeBtn');
      function applyTheme(t) {
        var light = t === 'light';
        if (light) document.documentElement.setAttribute('data-theme', 'light');
        else document.documentElement.removeAttribute('data-theme');
        if (tb) tb.textContent = light ? '☀' : '☾';
        try { localStorage.setItem('specul-theme', light ? 'light' : 'dark'); } catch (e) {}
      }
      var th = 'dark';
      try { th = localStorage.getItem('specul-theme') || 'dark'; } catch (e) {}
      applyTheme(th);
      if (tb) tb.addEventListener('click', function () {
        applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
      });
    })();

  var _hmt = _hmt || [];

  })();
</script>
